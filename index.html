<!DOCTYPE html>
<html lang="es-GT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL PISO — Simulador de Ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#DDD8C8;
  --papel-alt:#CFC9B6;
  --asfalto:#16181C;
  --tinta:#2E4B6B;
  --senal:#F2B705;
  --taller:#1F6F5C;
  --alerta:#B23A2F;
  --linea:rgba(22,24,28,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--papel);color:var(--asfalto);font-family:'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{
  min-height:100vh;
  background-image:
    repeating-linear-gradient(0deg,transparent 0 27px,rgba(46,75,107,.07) 27px 28px),
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.5),transparent 60%);
  padding:0 0 64px;
}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}

/* ---------- CLUSTER (barra superior) ---------- */
.cluster{
  background:var(--asfalto);color:var(--papel);
  border-bottom:4px solid var(--senal);
  padding:12px 0;position:sticky;top:0;z-index:20;
}
.cluster-in{max-width:680px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:14px}
.gauge{width:96px;height:56px;flex:0 0 auto}
.gauge-num{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;opacity:.65}
.cluster-meta{flex:1;min-width:0}
.cluster-meta .quien{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:.02em;line-height:1.1;text-transform:uppercase}
.cluster-meta .que{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.05em;opacity:.7;margin-top:3px}
.pts{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;background:var(--senal);color:var(--asfalto);padding:4px 8px;white-space:nowrap}

/* ---------- TIPOGRAFIA ---------- */
h1{font-family:'Anton',sans-serif;font-size:clamp(46px,13vw,88px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
h2{font-family:'Anton',sans-serif;font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta)}
p{font-size:16px;line-height:1.55}

/* ---------- TARJETA ESCENA ---------- */
.hoja{
  background:#EFEBDD;border:1px solid var(--linea);
  box-shadow:3px 3px 0 rgba(22,24,28,.14);
  padding:20px;margin-top:20px;position:relative;
}
.hoja::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tinta);
}
.hoja .fase{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta);display:block;margin-bottom:10px}
.escena{font-size:16.5px;line-height:1.6}
.escena em{font-style:normal;background:linear-gradient(transparent 62%,var(--senal) 62%)}

/* ---------- OPCIONES ---------- */
.ops{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.op{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:#EFEBDD;border:1px solid var(--linea);border-left:5px solid var(--asfalto);
  padding:13px 14px;font:inherit;font-size:15.5px;line-height:1.45;color:inherit;cursor:pointer;
  transition:transform .12s ease,background .12s ease;
}
.op:hover:not(:disabled){background:#fff;transform:translateX(3px)}
.op:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.op:disabled{cursor:default;opacity:.42}
.op .letra{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;background:var(--asfalto);color:var(--papel);width:22px;height:22px;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.op.elegida{opacity:1;background:#fff}
.op.buena{border-left-color:var(--taller)}
.op.buena .letra{background:var(--taller)}
.op.mala{border-left-color:var(--alerta)}
.op.mala .letra{background:var(--alerta)}

/* ---------- SELLO / FEEDBACK ---------- */
.sello{margin-top:16px;border:2px solid var(--asfalto);background:#EFEBDD;padding:16px;animation:entra .28s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sello-top{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.veredicto{font-family:'Anton',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.02em;padding:3px 10px;transform:rotate(-1.5deg)}
.v-bien{background:var(--taller);color:#fff}
.v-medio{background:var(--senal);color:var(--asfalto)}
.v-mal{background:var(--alerta);color:#fff}
.delta{font-family:'Space Mono',monospace;font-weight:700;font-size:14px}
.principio{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta);margin-top:11px;padding-top:9px;border-top:1px dashed var(--linea)}

/* ---------- BOTONES ---------- */
.btn{
  font-family:'Anton',sans-serif;font-size:18px;letter-spacing:.03em;text-transform:uppercase;
  background:var(--asfalto);color:var(--papel);border:none;padding:14px 22px;cursor:pointer;
  box-shadow:4px 4px 0 var(--senal);transition:transform .1s ease,box-shadow .1s ease;
}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--senal)}
.btn:focus-visible{outline:3px solid var(--tinta);outline-offset:3px}
.btn.sec{background:transparent;color:var(--asfalto);border:2px solid var(--asfalto);box-shadow:none;font-size:15px;padding:11px 18px}
.btn.sec:hover{background:var(--asfalto);color:var(--papel);transform:none}
.btn.full{width:100%;margin-top:16px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* ---------- PORTADA ---------- */
.portada{padding-top:44px}
.portada .sub{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.06em;line-height:1.7;margin-top:14px;max-width:44ch}
.marca{display:inline-block;background:var(--asfalto);color:var(--senal);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;padding:5px 10px;text-transform:uppercase}
.campo{margin-top:26px}
.campo label{display:block;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta);margin-bottom:6px}
.campo input{
  width:100%;background:transparent;border:none;border-bottom:2.5px solid var(--asfalto);
  font-family:'Anton',sans-serif;font-size:28px;padding:6px 2px;color:var(--asfalto);text-transform:uppercase;
}
.campo input:focus{outline:none;border-bottom-color:var(--tinta);background:rgba(255,255,255,.4)}
.modos{display:grid;gap:11px;margin-top:26px}
.modo{
  background:#EFEBDD;border:1px solid var(--linea);border-left:5px solid var(--tinta);
  padding:15px 16px;text-align:left;cursor:pointer;font:inherit;color:inherit;
  transition:transform .12s ease,background .12s ease;
}
.modo:hover{background:#fff;transform:translateX(3px)}
.modo:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.modo b{font-family:'Anton',sans-serif;font-size:20px;text-transform:uppercase;display:block;letter-spacing:.01em}
.modo span{font-size:14px;line-height:1.45;display:block;margin-top:4px;opacity:.8}

/* ---------- LISTAS ---------- */
.nunca{list-style:none;margin-top:16px}
.nunca li{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--linea);font-size:15.5px;line-height:1.45}
.nunca li::before{content:'✕';font-family:'Space Mono',monospace;font-weight:700;color:var(--alerta);flex:0 0 auto}
.rank{list-style:none;margin-top:14px}
.rank li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--linea);font-family:'Space Mono',monospace;font-size:14px}
.rank li .pos{font-weight:700;width:26px;color:var(--tinta)}
.rank li .nom{flex:1;font-family:'Public Sans',sans-serif;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li .sc{font-weight:700}
.vacio{font-family:'Space Mono',monospace;font-size:13px;opacity:.6;margin-top:14px}

/* ---------- TRADUCTOR ---------- */
.reloj{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;background:var(--asfalto);color:var(--senal);padding:5px 9px}
.reloj.poco{background:var(--alerta);color:#fff}
.specbox{background:var(--asfalto);color:var(--papel);padding:16px;margin-top:16px}
.specbox .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.specbox .v{font-family:'Anton',sans-serif;font-size:23px;text-transform:uppercase;line-height:1.1;margin-top:4px}
.specbox .c{font-size:14.5px;line-height:1.5;margin-top:11px;padding-top:11px;border-top:1px solid rgba(221,216,200,.25);opacity:.9}

/* ---------- RESULTADO ---------- */
.gran-num{font-family:'Anton',sans-serif;font-size:96px;line-height:.85;letter-spacing:-.02em}
.tag{display:inline-block;font-family:'Anton',sans-serif;font-size:22px;text-transform:uppercase;padding:5px 12px;transform:rotate(-1.5deg);margin-top:8px}
.desglose{margin-top:22px}
.desglose .fila{display:flex;gap:11px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--linea);font-size:14.5px;line-height:1.4}
.desglose .fila .n{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:2px 6px;flex:0 0 auto}
.n.ok{background:var(--taller);color:#fff}
.n.med{background:var(--senal);color:var(--asfalto)}
.n.no{background:var(--alerta);color:#fff}
footer{margin-top:44px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.05em;opacity:.55;line-height:1.7}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.gauge{width:78px;height:46px}.cluster-meta .quien{font-size:16px}}
</style>
</head>
<body>

<!-- ===== CLUSTER ===== -->
<div class="cluster hidden" id="cluster">
  <div class="cluster-in">
    <div>
      <svg class="gauge" viewBox="0 0 120 68" aria-hidden="true">
        <path d="M14 60 A46 46 0 0 1 33 23" fill="none" stroke="#B23A2F" stroke-width="7"/>
        <path d="M33 23 A46 46 0 0 1 87 23" fill="none" stroke="#F2B705" stroke-width="7"/>

        <g id="aguja" style="transform-origin:60px 60px;transition:transform .55s cubic-bezier(.34,1.4,.5,1)">
          <line x1="60" y1="60" x2="60" y2="20" stroke="#DDD8C8" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        <circle cx="60" cy="60" r="5" fill="#DDD8C8"/>
      </svg>

    </div>
    <div class="cluster-meta">
      <div class="quien" id="cQuien">—</div>

    </div>
    <div class="pts" id="cPts">0 PTS</div>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
/* =======================================================
   ALMACENAMIENTO
   Guarda el ranking. Funciona en 3 niveles, en este orden:
   1) window.storage  -> cuando el juego corre dentro de Claude
   2) localStorage    -> cuando corre en el navegador / Vercel
   3) memoria         -> si todo lo demas falla
   Para conectar Supabase, ver las funciones cargarRanking()
   y guardarPuntaje() mas abajo.
======================================================= */
const Store = (() => {
  const mem = {};
  const tieneWS = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  return {
    async get(k){
      if(tieneWS){ try{ const r = await window.storage.get(k, true); return r ? r.value : null; }catch(e){} }
      try{ const v = localStorage.getItem(k); if(v !== null) return v; }catch(e){}
      return mem[k] ?? null;
    },
    async set(k,v){
      if(tieneWS){ try{ await window.storage.set(k, v, true); return; }catch(e){} }
      try{ localStorage.setItem(k,v); return; }catch(e){}
      mem[k] = v;
    }
  };
})();
const CLAVE_RANKING = 'elpiso:ranking:v1';

async function cargarRanking(){
  try{ const raw = await Store.get(CLAVE_RANKING); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
async function guardarPuntaje(nombre, puntos, modo){
  const lista = await cargarRanking();
  lista.push({ nombre, puntos, modo, fecha: Date.now() });
  lista.sort((a,b) => b.puntos - a.puntos);
  await Store.set(CLAVE_RANKING, JSON.stringify(lista.slice(0,40)));
}

/* =======================================================
   CLIENTES
   Cada cliente trae su vida real: eso alimenta el
   diagnostico, la traduccion de specs y los dos futuros.
======================================================= */
const CLIENTES = [

  },
  {

    entrada:'Entra todavía con el uniforme puesto. Se ve cansada. Se para frente a una moto y la ve fijo sin decir nada.',

/* =======================================================
   LAS 7 FASES DEL TURNO
   pts: sube o baja la confianza del cliente y el puntaje.
======================================================= */
function construirFases(c){
  return [
  {
    fase:'Fase 1 — La entrada',
    escena:`${c.entrada} Usted está a cuatro metros. <em>¿Qué hace?</em>`,
    ops:[
      { t:'Esperar. Si de verdad le interesa, él se va a acercar a preguntar.', pts:-15, v:'mal',
        fb:'Quedarse callado viendo entrar al cliente es el error más caro del piso. En los primeros 10 segundos el cliente ya decidió si usted le va a servir o no.', p:'Regla de oro 15' },
      { t:'«Buenos días. ¿Tiene algo en mente, o quiere que le ayude a encontrar su moto ideal?»', pts:20, v:'bien',
        fb:'Esa es la apertura exacta. Le da salida al que ya sabe qué quiere y le abre la puerta al que no sabe — que son la mayoría.', p:'Frase exacta 10' },
      { t:'«Buenos días, ¿de cuánto es su presupuesto?»', pts:-8, v:'mal',
        fb:'Abrir con presupuesto convierte la visita en una negociación de precio antes de que exista valor. Y el precio casi nunca fue lo que decidió la experiencia.', p:'Hallazgo 1' }
    ]
  },
  {
    fase:'Fase 2 — Diagnosticar',
    escena:`${c.nombre} le contesta: «Fíjese que sí, ando viendo una moto.» Y se queda esperando. <em>Todavía no le ha mostrado ninguna moto.</em>`,
    ops:[
      { t:'«Venga, le enseño esta que es la que más sale.»', pts:-15, v:'mal',
        fb:'Decidir la moto del cliente antes de preguntar es adivinar. Si acierta fue suerte; si falla, ya perdió la venta y no sabe por qué.', p:'Regla de oro 16' },
      { t:'«¿Para qué la va a usar principalmente?»', pts:20, v:'bien',
        fb:'La pregunta madre. El cliente puede no saber qué moto quiere, pero siempre sabe cómo la va a usar. Preguntar siempre antes de mostrar.', p:'Frase exacta 11 · Método paso 6' },
      { t:'«¿Anda buscando algo económico, verdad?»', pts:-10, v:'mal',
        fb:'Pregunta cerrada: usted le puso la respuesta en la boca y se cerró el diagnóstico. Además le sembró la idea de que lo demás está caro.', p:'Regla de oro 17' }
    ]
  },
  {
    fase:'Fase 3 — Traducir, no listar',
    escena:`${c.nombre} le cuenta: «${c.uso}» Usted lo lleva a la <em>${c.moto}</em>. Ahora tiene que explicarle por qué esta.`,
    ops:[
      { t:`«Mire, esta trae ${c.spec}.»`, pts:-12, v:'mal',
        fb:'Listar specs fue el error más repetido de las 14 visitas. Un spec sin traducir no significa nada para alguien que no sabe de motos.', p:'Hallazgo 4' },
      { t:`«Trae ${c.spec}, así que ${c.beneficio}.»`, pts:8, v:'medio',
        fb:'Va por buen camino: ya tradujo el spec en beneficio. Pero le falta la tercera parte, la que casi nadie dice.', p:'Fórmula 14' },
      { t:`«Trae ${c.spec}, eso hace que ${c.beneficio}, y es ideal para usted porque ${c.necesidad}.»`, pts:20, v:'bien',
        fb:'Fórmula completa: tiene [spec] → le permite [beneficio] → ideal para usted porque [su necesidad]. La tercera parte es la que cierra.', p:'Fórmula 14' }
    ]
  },
  {
    fase:'Fase 4 — Los dos futuros',
    escena:`${c.nombre} está viendo la moto. Le comenta: «${c.dia}» <em>Le acaba de regalar el material que necesita.</em>`,
    ops:[
      { t:'«Solo hoy tenemos promoción. Si no la lleva hoy le sube de precio.»', pts:-12, v:'mal',
        fb:'Eso es urgencia de descuento, y el cliente ya la conoce. La urgencia real no viene del precio, viene de lo que le está costando no cambiar.', p:'Método paso 7' },
      { t:'«Piénselo con calma y regrese cuando quiera.»', pts:-6, v:'mal',
        fb:'Nadie regresa. Solo 1 de 14 vendedores intentó crear urgencia: ese es el hueco más grande del mercado, y usted lo acaba de dejar abierto.', p:'Hallazgo 3' },
      { t:`«Imagínese el lunes: ${c.futuro}. Y ahora imagínese el mismo lunes sin la moto: ${c.sinCambio}.»`, pts:22, v:'bien',
        fb:'Los dos futuros, con detalles del día de ÉL. Ahí es donde nace la urgencia real: el cliente ve lo que le cuesta seguir igual.', p:'Método paso 7' }
    ]
  },

/* =======================================================
   MOTOR DEL JUEGO
======================================================= */
const app = document.getElementById('app');
const cluster = document.getElementById('cluster');
const aguja = document.getElementById('aguja');
const gaugeNum = document.getElementById('gaugeNum');
const cQuien = document.getElementById('cQuien');
const cQue = document.getElementById('cQue');
const cPts = document.getElementById('cPts');

let jugador = '';
const E = { cliente:null, fases:[], i:0, confianza:50, puntos:0, historial:[] };

function moverAguja(){
  const g = -90 + (E.confianza/100)*180;
  aguja.style.transform = `rotate(${g}deg)`;
  gaugeNum.textContent = 'CONFIANZA ' + Math.round(E.confianza);
  cPts.textContent = E.puntos + ' PTS';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ---------- PORTADA ---------- */
function portada(){
  clearInterval(T.reloj);
  cluster.classList.add('hidden');
  app.innerHTML = `
  <div class="portada">
    <span class="marca">Inspección de 14 visitas</span>
    <h1>El<br>Piso</h1>
    <p class="sub">Su energía pesa más que sus specs.<br>Siete decisiones. Un cliente real. El termómetro no miente.</p>
    <div class="campo">
      <label for="nom">Su nombre</label>
      <input id="nom" maxlength="18" placeholder="ESCRÍBALO AQUÍ" autocomplete="off">
    </div>
    <div class="modos">
      <button class="modo" data-m="turno"><b>Atender un cliente</b><span>Un turno completo, de la entrada al cierre. Siete decisiones.</span></button>
      <button class="modo" data-m="trad"><b>Traductor de specs</b><span>Contrarreloj. Convierta specs en razones para comprar.</span></button>
      <button class="modo" data-m="reglas"><b>Lo que nunca debe pasar</b><span>Las seis cosas que mataron ventas en la inspección.</span></button>
      <button class="modo" data-m="rank"><b>Ranking del equipo</b><span>Quién va arriba.</span></button>
    </div>
    <footer>EL PISO · Material de entrenamiento interno<br>Basado en 14 visitas de inspección a piso de ventas.</footer>
  </div>`;
  const inp = document.getElementById('nom');
  inp.value = jugador;
  app.querySelectorAll('.modo').forEach(b => b.addEventListener('click', () => {
    jugador = (inp.value || '').trim().slice(0,18);
    const m = b.dataset.m;
    if((m === 'turno' || m === 'trad') && !jugador){
      inp.focus();
      inp.placeholder = 'PONGA SU NOMBRE PRIMERO';
      return;
    }
    if(m === 'turno') iniciarTurno();
    if(m === 'trad') iniciarTraductor();
    if(m === 'reglas') pantallaReglas();
    if(m === 'rank') pantallaRanking();
  }));
}

/* ---------- MODO 1: ATENDER UN CLIENTE ---------- */
function iniciarTurno(){
  E.cliente = CLIENTES[Math.floor(Math.random()*CLIENTES.length)];
  E.fases = construirFases(E.cliente);
  E.i = 0; E.confianza = 50; E.puntos = 0; E.historial = [];
  cluster.classList.remove('hidden');
  cQuien.textContent = `${E.cliente.nombre}, ${E.cliente.edad}`;
  cQue.textContent = E.cliente.oficio.toUpperCase();
  moverAguja();
  pintarFase();
}

function pintarFase(){
  const f = E.fases[E.i];
  app.innerHTML = `
  <div class="hoja">
    <span class="fase">${esc(f.fase)} · ${E.i+1} de ${E.fases.length}</span>
    <p class="escena">${f.escena}</p>
  </div>
  <div class="ops" id="ops"></div>
  <div id="fb"></div>`;
  const cont = document.getElementById('ops');
  f.ops.forEach((o,ix) => {
    const b = document.createElement('button');
    b.className = 'op';
    b.innerHTML = `<span class="letra">${'ABC'[ix]}</span><span>${esc(o.t)}</span>`;
    b.addEventListener('click', () => elegir(ix));
    cont.appendChild(b);
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

function elegir(ix){
  const f = E.fases[E.i];
  const o = f.ops[ix];
  E.puntos += o.pts;
  E.confianza = Math.max(0, Math.min(100, E.confianza + o.pts));
  E.historial.push({ fase:f.fase, v:o.v, pts:o.pts });
  moverAguja();

  document.querySelectorAll('#ops .op').forEach((b,i) => {
    b.disabled = true;
    if(i === ix){
      b.classList.add('elegida');
      if(o.v === 'bien') b.classList.add('buena');
      else if(o.v === 'mal') b.classList.add('mala');
    }
  });

  const vClase = o.v === 'bien' ? 'v-bien' : (o.v === 'medio' ? 'v-medio' : 'v-mal');
  const vTexto = o.v === 'bien' ? 'Bien hecho' : (o.v === 'medio' ? 'A medias' : 'Ahí la perdió');
  const ultima = E.i === E.fases.length - 1;
  const seFue = E.confianza <= 0;

  document.getElementById('fb').innerHTML = `
  <div class="sello">
    <div class="sello-top">
      <span class="veredicto ${vClase}">${vTexto}</span>
      <span class="delta">${o.pts > 0 ? '+' : ''}${o.pts} confianza</span>
    </div>
    <p>${esc(o.fb)}</p>
    <div class="principio">${esc(o.p)}</div>
  </div>
  <button class="btn full" id="seguir">${seFue ? 'Ver qué pasó' : (ultima ? 'Cerrar el turno' : 'Siguiente')}</button>`;

  document.getElementById('seguir').addEventListener('click', () => {
    if(seFue || ultima){ resultadoTurno(seFue); }
    else { E.i++; pintarFase(); }
  });
  document.getElementById('fb').scrollIntoView({behavior:'smooth', block:'nearest'});
}

async function resultadoTurno(seFue){
  const c = E.confianza;
  let tag, color, texto;
  if(seFue){ tag = 'Se fue'; color = 'var(--alerta)'; texto = `${E.cliente.nombre} salió sin comprar y no va a regresar. La moto no tuvo la culpa.`; }
  else if(c >= 85){ tag = 'Cerró la venta'; color = 'var(--taller)'; texto = `${E.cliente.nombre} se la llevó hoy. Diagnosticó antes de mostrar, tradujo en vez de listar y aguantó el silencio.`; }
  else if(c >= 60){ tag = 'Se la lleva'; color = 'var(--taller)'; texto = `${E.cliente.nombre} compró, pero pidió descuento y lo pensó dos veces. Con el método completo se cerraba sin regatear.`; }
  else if(c >= 35){ tag = 'Lo va a pensar'; color = 'var(--senal)'; texto = `${E.cliente.nombre} dijo que regresa. Casi nadie regresa. Le faltó urgencia real.`; }
  else { tag = 'La perdió'; color = 'var(--alerta)'; texto = `${E.cliente.nombre} se fue a ver a la competencia. Misma moto, mismo precio, otra experiencia.`; }

  await guardarPuntaje(jugador, E.puntos, 'Cliente');

  const filas = E.historial.map(h => {
    const cls = h.v === 'bien' ? 'ok' : (h.v === 'medio' ? 'med' : 'no');
    return `<div class="fila"><span class="n ${cls}">${h.pts > 0 ? '+' : ''}${h.pts}</span><span>${esc(h.fase)}</span></div>`;
  }).join('');

  app.innerHTML = `
  <div style="padding-top:26px">
    <span class="eyebrow">Resultado del turno</span>
    <div class="gran-num">${E.puntos}</div>
    <div><span class="tag" style="background:${color};color:#fff">${tag}</span></div>
    <p style="margin-top:16px;max-width:46ch">${esc(texto)}</p>
    <div class="desglose">${filas}</div>
    <div class="hoja" style="margin-top:24px">
      <span class="fase">La conclusión de las 14 visitas</span>
      <p class="escena">La misma moto, mismo modelo y mismo precio, quedó como la mejor experiencia con un vendedor y entre las tres peores con otro. <em>Su energía pesa más que sus specs.</em></p>
    </div>
    <div class="btnrow">
      <button class="btn" id="otra">Otro cliente</button>
      <button class="btn sec" id="menu">Menú</button>
      <button class="btn sec" id="ver">Ranking</button>
    </div>
    <footer>Puntaje guardado a nombre de ${esc(jugador)}.</footer>
  </div>`;
  document.getElementById('otra').addEventListener('click', iniciarTurno);
  document.getElementById('menu').addEventListener('click', portada);
  document.getElementById('ver').addEventListener('click', pantallaRanking);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- MODO 2: TRADUCTOR ---------- */
const T = { orden:[], i:0, aciertos:0, puntos:0, seg:60, reloj:null };

function iniciarTraductor(){
  T.orden = TRADUCCIONES.map((x,i) => i).sort(() => Math.random()-0.5);
  T.i = 0; T.aciertos = 0; T.puntos = 0; T.seg = 60;
  cluster.classList.add('hidden');
  clearInterval(T.reloj);
  T.reloj = setInterval(() => {
    T.seg--;
    const r = document.getElementById('reloj');
    if(r){ r.textContent = T.seg + 's'; r.classList.toggle('poco', T.seg <= 15); }
    if(T.seg <= 0){ clearInterval(T.reloj); resultadoTraductor(true); }
  }, 1000);
  pintarTrad();
}

function pintarTrad(){
  if(T.i >= T.orden.length){ clearInterval(T.reloj); resultadoTraductor(false); return; }
  const it = TRADUCCIONES[T.orden[T.i]];
  const ops = it.ops.map((o,i) => ({...o, i})).sort(() => Math.random()-0.5);
  app.innerHTML = `
  <div style="padding-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px">
    <span class="eyebrow">Traductor · ${T.i+1} de ${T.orden.length}</span>
    <span class="reloj" id="reloj">${T.seg}s</span>
  </div>
  <div class="specbox">
    <div class="k">El spec</div>
    <div class="v">${esc(it.spec)}</div>
    <div class="c"><b>El cliente:</b> ${esc(it.cliente)}</div>
  </div>
  <p style="margin-top:16px;font-size:14.5px;opacity:.8">Escoja la traducción completa: spec → le permite → ideal para usted porque.</p>
  <div class="ops" id="ops"></div>
  <div id="fb"></div>`;
  const cont = document.getElementById('ops');
  ops.forEach((o,ix) => {
    const b = document.createElement('button');
    b.className = 'op';
    b.innerHTML = `<span class="letra">${'ABC'[ix]}</span><span>${esc(o.t)}</span>`;
    b.addEventListener('click', () => responderTrad(o, ops));
    cont.appendChild(b);
  });
}

function responderTrad(elegida, ops){
  if(elegida.ok){ T.aciertos++; T.puntos += 12 + Math.max(0, Math.floor(T.seg/10)); }
  else { T.puntos -= 5; }
  document.querySelectorAll('#ops .op').forEach((b,i) => {
    b.disabled = true;
    if(ops[i].ok) b.classList.add('elegida','buena');
    if(ops[i] === elegida && !elegida.ok) b.classList.add('elegida','mala');
  });
  document.getElementById('fb').innerHTML = `
  <div class="sello">
    <div class="sello-top">
      <span class="veredicto ${elegida.ok ? 'v-bien' : 'v-mal'}">${elegida.ok ? 'Correcta' : 'Incompleta'}</span>
      <span class="delta">${T.puntos} pts</span>
    </div>
    <p>${esc(elegida.fb)}</p>
    <div class="principio">Fórmula 14 · Hallazgo 4</div>
  </div>
  <button class="btn full" id="sig">Siguiente spec</button>`;
  document.getElementById('sig').addEventListener('click', () => { T.i++; pintarTrad(); });
}

  app.innerHTML = `

    <div class="gran-num">${T.puntos}</div>

  window.scrollTo({top:0, behavior:'smooth'});
}

async function pantallaRanking(){
  cluster.classList.add('hidden');
  app.innerHTML = `<div style="padding-top:26px"><span class="eyebrow">Ranking del equipo</span><h2 style="margin-top:8px">Quién va<br>arriba</h2><p class="vacio">Cargando…</p></div>`;
  const lista = (await cargarRanking()).slice(0,15);
  const filas = lista.length
    ? `<ul class="rank">${lista.map((r,i) => `<li><span class="pos">${i+1}</span><span class="nom">${esc(r.nombre)}</span><span style="opacity:.55">${esc(r.modo)}</span><span class="sc">${r.puntos}</span></li>`).join('')}</ul>`
    : `<p class="vacio">Todavía nadie ha jugado. Sea el primero.</p>`;
  app.innerHTML = `
  <div style="padding-top:26px">
    <span class="eyebrow">Ranking del equipo</span>
    <h2 style="margin-top:8px">Quién va<br>arriba</h2>
    ${filas}
    <div class="btnrow"><button class="btn" id="menu">Volver</button></div>
  </div>`;
  document.getElementById('menu').addEventListener('click', portada);
  window.scrollTo({top:0, behavior:'smooth'});
}

portada();
</script>
</body>
</html>
