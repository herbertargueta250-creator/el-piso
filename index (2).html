<!DOCTYPE html>
<html lang="es-GT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL PISO — Simulador de Ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#DDD8C8; --papel2:#EFEBDD; --asfalto:#16181C; --tinta:#2E4B6B;
  --senal:#F2B705; --taller:#1F6F5C; --alerta:#B23A2F; --linea:rgba(22,24,28,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--papel);color:var(--asfalto);font-family:'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 0 64px;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(46,75,107,.06) 27px 28px),radial-gradient(circle at 20% 0%,rgba(255,255,255,.5),transparent 60%);}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
.px{image-rendering:pixelated;display:block}

/* CLUSTER */
.cluster{background:var(--asfalto);color:var(--papel);border-bottom:4px solid var(--senal);padding:10px 0;position:sticky;top:0;z-index:20}
.cluster-in{max-width:680px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px}
.retrato{background:rgba(221,216,200,.1);padding:3px;flex:0 0 auto}
.retrato .px{width:52px;height:52px}
.gauge{width:84px;height:50px}
.gauge-num{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;opacity:.65;text-align:center}
.cluster-meta{flex:1;min-width:0}
.cluster-meta .quien{font-family:'Anton',sans-serif;font-size:17px;letter-spacing:.02em;line-height:1.1;text-transform:uppercase}
.cluster-meta .que{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;opacity:.7;margin-top:2px}
.pts{font-family:'Space Mono',monospace;font-weight:700;font-size:12px;background:var(--senal);color:var(--asfalto);padding:3px 7px;white-space:nowrap}
.reloj{font-family:'Space Mono',monospace;font-weight:700;font-size:12px;background:var(--papel);color:var(--asfalto);padding:3px 7px;margin-top:4px;text-align:center}
.reloj.poco{background:var(--alerta);color:#fff}

/* TIPO */
h1{font-family:'Anton',sans-serif;font-size:clamp(44px,12.5vw,84px);line-height:.9;text-transform:uppercase}
h2{font-family:'Anton',sans-serif;font-size:26px;line-height:1.05;text-transform:uppercase}
h3{font-family:'Anton',sans-serif;font-size:19px;line-height:1.1;text-transform:uppercase}
.eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta)}
p{font-size:16px;line-height:1.55}

/* HOJA */
.hoja{background:var(--papel2);border:1px solid var(--linea);box-shadow:3px 3px 0 rgba(22,24,28,.13);padding:18px;margin-top:18px;position:relative}
.hoja::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tinta)}
.hoja .fase{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--tinta);display:block;margin-bottom:9px}
.escena{font-size:16.5px;line-height:1.6}
.escena em{font-style:normal;background:linear-gradient(transparent 62%,var(--senal) 62%)}
.dice{border-left:3px solid var(--senal);padding-left:11px;margin-top:11px;font-style:italic;font-size:15.5px;line-height:1.5}

/* OPCIONES */
.ops{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.op{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--papel2);border:1px solid var(--linea);border-left:5px solid var(--asfalto);padding:12px 13px;font:inherit;font-size:15.5px;line-height:1.45;color:inherit;cursor:pointer;transition:transform .12s ease,background .12s ease}
.op:hover:not(:disabled){background:#fff;transform:translateX(3px)}
.op:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.op:disabled{cursor:default;opacity:.4}
.op .letra{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;background:var(--asfalto);color:var(--papel);width:22px;height:22px;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.op.elegida{opacity:1;background:#fff}
.op.buena{border-left-color:var(--taller)}.op.buena .letra{background:var(--taller)}
.op.mala{border-left-color:var(--alerta)}.op.mala .letra{background:var(--alerta)}

/* ESCRIBIR */
.escribe{margin-top:14px}
.escribe textarea{width:100%;min-height:130px;background:var(--papel2);border:1px solid var(--linea);border-left:5px solid var(--senal);padding:13px;font:inherit;font-size:16px;line-height:1.5;color:inherit;resize:vertical}
.escribe textarea:focus{outline:none;background:#fff;border-left-color:var(--tinta)}
.pistas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pista{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:rgba(46,75,107,.12);color:var(--tinta);padding:4px 8px}
.contador{font-family:'Space Mono',monospace;font-size:11px;opacity:.6;margin-top:7px}

/* SELLO */
.sello{margin-top:14px;border:2px solid var(--asfalto);background:var(--papel2);padding:15px;animation:entra .28s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sello-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.veredicto{font-family:'Anton',sans-serif;font-size:19px;text-transform:uppercase;padding:3px 10px;transform:rotate(-1.5deg)}
.v-bien{background:var(--taller);color:#fff}.v-medio{background:var(--senal);color:var(--asfalto)}.v-mal{background:var(--alerta);color:#fff}
.delta{font-family:'Space Mono',monospace;font-weight:700;font-size:13px}
.principio{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta);margin-top:10px;padding-top:8px;border-top:1px dashed var(--linea)}

/* BOTONES */
.btn{font-family:'Anton',sans-serif;font-size:18px;letter-spacing:.03em;text-transform:uppercase;background:var(--asfalto);color:var(--papel);border:none;padding:13px 21px;cursor:pointer;box-shadow:4px 4px 0 var(--senal);transition:transform .1s ease,box-shadow .1s ease}
.btn:hover:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--senal)}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible{outline:3px solid var(--tinta);outline-offset:3px}
.btn.sec{background:transparent;color:var(--asfalto);border:2px solid var(--asfalto);box-shadow:none;font-size:15px;padding:10px 17px}
.btn.sec:hover{background:var(--asfalto);color:var(--papel);transform:none}
.btn.full{width:100%;margin-top:14px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}

/* PORTADA */
.portada{padding-top:38px}
.sub{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.05em;line-height:1.7;margin-top:12px;max-width:44ch}
.marca{display:inline-block;background:var(--asfalto);color:var(--senal);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;padding:5px 10px;text-transform:uppercase}
.desfile{display:flex;gap:2px;margin:16px 0 0;overflow:hidden}
.desfile .px{width:46px;height:46px}
.campo{margin-top:22px}
.campo label{display:block;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--tinta);margin-bottom:5px}
.campo input{width:100%;background:transparent;border:none;border-bottom:2.5px solid var(--asfalto);font-family:'Anton',sans-serif;font-size:27px;padding:5px 2px;color:var(--asfalto);text-transform:uppercase}
.campo input:focus{outline:none;border-bottom-color:var(--tinta);background:rgba(255,255,255,.4)}
.modos{display:grid;gap:10px;margin-top:22px}
.modo{display:flex;gap:12px;align-items:center;background:var(--papel2);border:1px solid var(--linea);border-left:5px solid var(--tinta);padding:14px 15px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .12s ease,background .12s ease}
.modo:hover{background:#fff;transform:translateX(3px)}
.modo:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.modo .px{width:44px;height:44px;flex:0 0 auto}
.modo b{font-family:'Anton',sans-serif;font-size:19px;text-transform:uppercase;display:block}
.modo span{font-size:13.5px;line-height:1.4;display:block;margin-top:3px;opacity:.8}

/* NIVELES */
.niveles{display:grid;gap:10px;margin-top:18px}
.nivel{background:var(--papel2);border:1px solid var(--linea);border-left:5px solid var(--asfalto);padding:15px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .12s ease,background .12s ease}
.nivel:hover{background:#fff;transform:translateX(3px)}
.nivel:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.nivel .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.nivel b{font-family:'Anton',sans-serif;font-size:21px;text-transform:uppercase}
.mult{font-family:'Space Mono',monospace;font-weight:700;font-size:12px;background:var(--senal);padding:3px 7px}
.nivel span{display:block;font-size:14px;line-height:1.45;margin-top:5px;opacity:.85}
.nivel.n1{border-left-color:var(--taller)}
.nivel.n2{border-left-color:var(--senal)}
.nivel.n3{border-left-color:var(--alerta)}

/* CATALOGO */
.ficha{background:var(--papel2);border:1px solid var(--linea);box-shadow:3px 3px 0 rgba(22,24,28,.13);margin-top:16px}
.ficha .top{background:var(--asfalto);padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ficha .top .px{width:126px;height:70px;flex:0 0 auto}
.ficha .top .id{flex:1;min-width:120px;color:var(--papel)}
.ficha .top .id b{font-family:'Anton',sans-serif;font-size:21px;text-transform:uppercase;display:block;line-height:1.1}
.ficha .top .id em{font-family:'Space Mono',monospace;font-size:11px;font-style:normal;opacity:.65;letter-spacing:.06em}
.ficha .precio{font-family:'Anton',sans-serif;font-size:22px;background:var(--senal);color:var(--asfalto);padding:4px 10px}
.ficha .cuerpo{padding:14px}
.ficha .ideal{font-size:14.5px;line-height:1.5;padding-bottom:11px;margin-bottom:11px;border-bottom:1px dashed var(--linea)}
.ficha .ideal b{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta);display:block;margin-bottom:4px}
.spec{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 0;border-bottom:1px dotted var(--linea)}
.spec:last-child{border-bottom:none}
.spec .s{font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700}
.spec .b{font-size:14.5px;line-height:1.4;opacity:.85}
.spec .b::before{content:'→ le permite ';font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--taller);font-weight:700}

/* LISTAS */
.nunca{list-style:none;margin-top:14px}
.nunca li{display:flex;gap:11px;padding:10px 0;border-bottom:1px dashed var(--linea);font-size:15.5px;line-height:1.45}
.nunca li::before{content:'X';font-family:'Space Mono',monospace;font-weight:700;color:var(--alerta);flex:0 0 auto}
.rank{list-style:none;margin-top:12px}
.rank li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--linea);font-family:'Space Mono',monospace;font-size:13px}
.rank li .pos{font-weight:700;width:24px;color:var(--tinta)}
.rank li .nom{flex:1;font-family:'Public Sans',sans-serif;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li .sc{font-weight:700}
.vacio{font-family:'Space Mono',monospace;font-size:13px;opacity:.6;margin-top:12px}

/* TRADUCTOR */
.specbox{background:var(--asfalto);color:var(--papel);padding:15px;margin-top:14px}
.specbox .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;opacity:.6}
.specbox .v{font-family:'Anton',sans-serif;font-size:22px;text-transform:uppercase;line-height:1.1;margin-top:3px}
.specbox .c{font-size:14.5px;line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid rgba(221,216,200,.25);opacity:.9}

/* RESULTADO */
.gran-num{font-family:'Anton',sans-serif;font-size:92px;line-height:.85}
.tag{display:inline-block;font-family:'Anton',sans-serif;font-size:21px;text-transform:uppercase;padding:5px 12px;transform:rotate(-1.5deg);margin-top:6px}
.repaso{margin-top:20px}
.item{border-left:4px solid var(--linea);padding:11px 0 11px 12px;margin-bottom:9px}
.item.ok{border-left-color:var(--taller)}.item.med{border-left-color:var(--senal)}.item.no{border-left-color:var(--alerta)}
.item .h{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.item .h b{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.item .h .d{font-family:'Space Mono',monospace;font-weight:700;font-size:12px}
.item .dijo{font-size:14px;line-height:1.45;opacity:.7;font-style:italic;margin-top:5px}
.item .ret{font-size:14.5px;line-height:1.5;margin-top:5px}
.item .pr{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta);margin-top:5px}
footer{margin-top:40px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.05em;opacity:.55;line-height:1.7}

/* GUARDADO */
.estado{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border:1px solid var(--linea);background:var(--papel2);font-family:'Space Mono',monospace;font-size:12.5px;line-height:1.45}
.estado .ic{font-weight:700;flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;font-size:12px}
.estado.pend{border-left:5px solid var(--senal)}
.estado.pend .ic{background:var(--senal);color:var(--asfalto)}
.estado.ok{border-left:5px solid var(--taller)}
.estado.ok .ic{background:var(--taller);color:#fff}
.estado.no{border-left:5px solid var(--alerta)}
.estado.no .ic{background:var(--alerta);color:#fff}
.estado .re{margin-left:auto;font-family:'Anton',sans-serif;font-size:13px;text-transform:uppercase;background:var(--asfalto);color:var(--papel);border:none;padding:6px 11px;cursor:pointer;flex:0 0 auto}

/* CHECKLIST DE LA RESPUESTA ESCRITA */
.lista{margin-top:11px;padding-top:10px;border-top:1px dashed var(--linea)}
.lista .li{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:14px;line-height:1.4}
.lista .li .m{font-family:'Space Mono',monospace;font-weight:700;font-size:11px;width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.lista .li.si .m{background:var(--taller);color:#fff}
.lista .li.no .m{background:var(--alerta);color:#fff}
.lista .li.no span{opacity:.75}

/* RANKING */
.vivo{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;background:var(--asfalto);color:var(--papel)}
.vivo .pt{width:7px;height:7px;background:#7A7A7A;border-radius:50%}
.vivo.on .pt{background:#4ADE80;animation:latir 1.6s infinite}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.25}}
.aviso{font-family:'Space Mono',monospace;font-size:11.5px;line-height:1.5;background:rgba(178,58,47,.1);border-left:4px solid var(--alerta);padding:10px 12px;margin-top:12px}
.rank li.yo{background:var(--senal);margin:0 -8px;padding-left:8px;padding-right:8px}
.rank li.nuevo{animation:entra .4s ease-out}
.rank li .fch{font-size:10.5px;opacity:.5}
pre{font-family:'Space Mono',monospace;font-size:11.5px;line-height:1.6;background:var(--asfalto);color:var(--papel);padding:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.hidden{display:none!important}
.cargando{font-family:'Space Mono',monospace;font-size:13px;opacity:.65;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px){.retrato .px{width:42px;height:42px}.gauge{width:66px;height:40px}.cluster-meta .quien{font-size:15px}.ficha .top .px{width:108px;height:60px}}
</style>
</head>
<body>
<div class="cluster hidden" id="cluster">
  <div class="cluster-in">
    <div class="retrato" id="retrato"></div>
    <div>
      <svg class="gauge" viewBox="0 0 120 68" aria-hidden="true">
        <path d="M14 60 A46 46 0 0 1 33 23" fill="none" stroke="#B23A2F" stroke-width="7"/>
        <path d="M33 23 A46 46 0 0 1 87 23" fill="none" stroke="#F2B705" stroke-width="7"/>
        <path d="M87 23 A46 46 0 0 1 106 60" fill="none" stroke="#1F6F5C" stroke-width="7"/>
        <g id="aguja" style="transform-origin:60px 60px;transition:transform .55s cubic-bezier(.34,1.4,.5,1)">
          <line x1="60" y1="60" x2="60" y2="20" stroke="#DDD8C8" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        <circle cx="60" cy="60" r="5" fill="#DDD8C8"/>
      </svg>
      <div class="gauge-num" id="gaugeNum">50</div>
    </div>
    <div class="cluster-meta">
      <div class="quien" id="cQuien">-</div>
      <div class="que" id="cQue">-</div>
    </div>
    <div>
      <div class="pts" id="cPts">0 PTS</div>
      <div class="reloj hidden" id="cReloj">25s</div>
    </div>
  </div>
</div>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===========================================================
   EL PISO — v2 — DATOS Y PIXEL ART
   =========================================================== */

/* ---------- 1. PIXEL ART: PERSONAS (16x16) ---------- */
const CUERPO = [
  '...kkkCSSCkkk...',
  '..kCCCCCCCCCCk..',
  '.kCCCACCCCACCCk.',
  '.kCCCCCCCCCCCCk.',
  '.kkkkkkkkkkkkkk.'
];
const PELOS = {
  corto: [
    '.....kkkkkk.....','....kHHHHHHk....','...kHHHHHHHHk...','...kHSSSSSSHk...',
    '...kSSSSSSSSk...','...kSESSSSESk...','...kSSSSSSSSk...','...kSSSkkSSSk...',
    '...kSSSSSSSSk...','....kSSSSSSk....','.....kSSSSk.....'
  ],
  largo: [
    '.....kkkkkk.....','....kHHHHHHk....','...kHHHHHHHHk...','..kHHHHHHHHHHk..',
    '..kHHSSSSSSHHk..','..kHSESSSSESHk..','..kHSSSSSSSSHk..','..kHSSSkkSSSHk..',
    '..kHSSSSSSSSHk..','..kHHSSSSSSHHk..','...kHHkSSkHHk...'
  ],
  gorra: [
    '.....kkkkkk.....','....kAAAAAAk....','...kAAAAAAAAk...','..kkkkkkkkkkkk..',
    '...kSSSSSSSSk...','...kSESSSSESk...','...kSSSSSSSSk...','...kSSSkkSSSk...',
    '...kSSSSSSSSk...','....kSSSSSSk....','.....kSSSSk.....'
  ]
};

function svgPersona(c, px){
  px = px || 6;
  const filas = PELOS[c.pelo].concat(CUERPO);
  const map = { k:'#14161A', E:'#14161A', H:c.cabello, S:c.piel, C:c.camisa, A:c.acento };
  let r = '';
  filas.forEach((fila, y) => {
    for(let x = 0; x < fila.length; x++){
      const col = map[fila[x]];
      if(col) r += `<rect x="${x*px}" y="${y*px}" width="${px}" height="${px}" fill="${col}"/>`;
    }
  });
  return `<svg class="px" viewBox="0 0 ${16*px} ${16*px}" width="${16*px}" height="${16*px}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

/* ---------- 2. PIXEL ART: MOTOS (36x20, rasterizadas) ---------- */
function rejillaMoto(m){
  const W = 36, H = 20;
  const g = Array.from({length:H}, () => Array(W).fill(null));
  const set = (x,y,c) => { x=Math.round(x); y=Math.round(y); if(c && x>=0 && x<W && y>=0 && y<H) g[y][x]=c; };
  const rect = (x0,y0,x1,y1,c) => { for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) set(x,y,c); };
  const disco = (cx,cy,r,c) => { for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(Math.hypot(x-cx,y-cy) <= r) set(x,y,c); } };

  const LLANTA='#1A1C20', RIN='#9A947F', METAL='#4A4E58', ESCAPE='#A9A390';

  // llantas
  [[8,14.5],[28,14.5]].forEach(([cx,cy]) => {
    disco(cx,cy,4.6,LLANTA); disco(cx,cy,2.6,RIN); disco(cx,cy,0.9,LLANTA);
  });
  // escape
  rect(13,15,24,16,ESCAPE);
  // horquilla y manubrio
  rect(25,8,27,13,METAL);
  rect(24,4,26,9,METAL);
  rect(21,3,28,4,METAL);
  // cuerpo
  rect(6,9,12,11,m.color);
  rect(7,10,26,12,m.color);
  rect(13,7,22,11,m.color);
  rect(22,6,25,11,m.color);
  // asiento
  rect(6,7,14,9,'#26282C');
  // faro
  rect(27,5,30,8,m.faro);

  // extras
  if(m.extra === 'parrilla'){ rect(2,7,8,8,m.acento); rect(3,9,3,10,m.acento); rect(7,9,7,10,m.acento); }
  if(m.extra === 'caja'){ rect(2,7,9,8,m.acento); rect(1,2,10,7,m.acento); rect(1,2,10,3,'#26282C'); rect(5,4,6,7,'#26282C'); }
  if(m.extra === 'estribos'){ rect(2,7,8,8,m.acento); rect(3,9,3,10,m.acento); rect(11,16,18,17,m.acento); }

  // contorno
  const fuera = [];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(g[y][x]) continue;
    if((g[y-1]&&g[y-1][x]) || (g[y+1]&&g[y+1][x]) || g[y][x-1] || g[y][x+1]) fuera.push([x,y]);
  }
  fuera.forEach(([x,y]) => g[y][x] = '#14161A');
  return g;
}

function svgMoto(m, px){
  px = px || 5;
  const g = rejillaMoto(m);
  let r = '';
  g.forEach((fila,y) => fila.forEach((c,x) => {
    if(c) r += `<rect x="${x*px}" y="${y*px}" width="${px}" height="${px}" fill="${c}"/>`;
  }));
  return `<svg class="px" viewBox="0 0 ${36*px} ${20*px}" width="${36*px}" height="${20*px}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

/* ---------- Respaldo local: si no hay señal, no se pierde nada ---------- */
const PENDIENTES = 'elpiso:pendientes';
function leerLocal(){ try{ return JSON.parse(localStorage.getItem(PENDIENTES) || '[]'); }catch(e){ return []; } }
function apuntarLocal(fila){
  try{
    const l = leerLocal();
    l.push({...fila, created_at:new Date().toISOString(), _local:true});
    l.sort((a,b) => b.score - a.score);
    localStorage.setItem(PENDIENTES, JSON.stringify(l.slice(0,60)));
  }catch(e){}
}

/* ---------- GUARDAR UN PUNTAJE ---------- */
async function guardarPuntaje(nombre, puntos){
  const fila = {
    player_name: String(nombre || 'ANÓNIMO').trim().slice(0,18).toUpperCase(),
    score: Math.round(Number(puntos) || 0)
  };
  if(!supabase){ apuntarLocal(fila); return {ok:false, motivo:'sin-conexion', fila}; }
  try{
    const { error } = await supabase.from(TABLA).insert([fila]);
    if(error) throw error;
    sincronizarPendientes();
    return {ok:true, fila};
  }catch(e){
    apuntarLocal(fila);
    return {ok:false, motivo:(e && e.message) || 'error', fila};
  }
}

/* ---------- LEER EL TOP 10 ---------- */
async function obtenerMejoresPuntajes(limite){
  limite = limite || 10;
  if(!supabase) return { ok:false, filas: leerLocal().slice(0,limite), motivo:'sin-conexion' };
  try{
    const { data, error } = await supabase
      .from(TABLA)
      .select('player_name, score, created_at')
      .order('score', { ascending:false })
      .limit(limite);
    if(error) throw error;
    return { ok:true, filas: data || [] };
  }catch(e){
    return { ok:false, filas: leerLocal().slice(0,limite), motivo:(e && e.message) || 'error' };
  }
}

/* ---------- Sube los puntajes que quedaron guardados sin señal ---------- */
async function sincronizarPendientes(){
  const l = leerLocal();
  if(!supabase || !l.length) return;
  try{
    const { error } = await supabase.from(TABLA)
      .insert(l.map(f => ({player_name:f.player_name, score:f.score})));
    if(error) throw error;
    localStorage.removeItem(PENDIENTES);
  }catch(e){}
}

/* ---------- RANKING EN VIVO (Supabase Realtime) ----------
   Requiere activar replicación de la tabla en Supabase:
   Database -> Replication -> supabase_realtime -> marcar Puntajes.
   Si no está activado, el ranking igual se refresca solo cada 15s.
   ------------------------------------------------------------ */
let _canal = null;
function escucharRanking(alCambiar){
  if(!supabase || _canal) return;
  try{
    _canal = supabase.channel('ranking-elpiso')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:TABLA }, () => alCambiar())
      .subscribe(estado => {
        const b = document.getElementById('vivo');
        if(b) b.classList.toggle('on', estado === 'SUBSCRIBED');
      });
  }catch(e){}
}
function dejarDeEscuchar(){
  if(_canal && supabase){ try{ supabase.removeChannel(_canal); }catch(e){} }
  _canal = null;
}

sincronizarPendientes();

/* ===========================================================
   10. REVISIÓN DE LAS RESPUESTAS ESCRITAS
   -----------------------------------------------------------
   Todo corre aquí en el navegador. No llama a ninguna IA, no
   necesita llaves y no cuesta nada por uso.
   Revisa ESTRUCTURA: que la respuesta traiga las partes que
   la inspección encontró que hacen la diferencia. No juzga
   la redacción, y por eso le muestra al vendedor exactamente
   qué parte le contó y cuál no.
   =========================================================== */
function norm(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

async function calificar(fase, texto, c){
  const max = fase.escrita.max;
  if(!texto || texto.trim().length < 15){
    return { pts:0, v:'mal', fb:'Eso no alcanza. El cliente está enfrente esperando que le diga algo completo.', partes:[] };
  }
  const { partes } = fase.escrita.local(texto);
  let pts = 0;
  partes.forEach(p => {
    if(p.ok) pts += (p.pts || 0);
    else if(p.castigo) pts -= p.castigo;
  });
  pts = Math.max(0, Math.min(max, pts));

  const fallaron = partes.filter(p => !p.ok);
  const v = pts >= max*0.75 ? 'bien' : pts >= max*0.4 ? 'medio' : 'mal';
  const fb = v === 'bien' ? 'Completa. Trae todo lo que hace falta para que esto cierre.'
    : v === 'medio' ? `Va por buen camino, pero se le quedó ${fallaron.length === 1 ? 'una parte' : fallaron.length + ' partes'} en el camino.`
    : 'Así no cierra. Vea abajo qué le faltó y vuélvalo a intentar en la siguiente ronda.';
  return { pts, v, fb, partes };
}

/* ---------- TURNO ---------- */
function iniciarTurno(nivel){
  E.nivel = nivel;
  E.c = CLIENTES[Math.floor(Math.random()*CLIENTES.length)];
  E.fases = construirFases(E.c).map(f => ({...f, ops: barajar(f.ops)}));
  E.i = 0; E.conf = 50; E.pts = 0; E.hist = [];
  cluster.classList.remove('hidden');
  retrato.innerHTML = svgPersona(E.c, 4);
  cQuien.textContent = `${E.c.nombre}, ${E.c.edad}`;
  cQue.textContent = `${E.c.oficio.toUpperCase()} · NIVEL ${nivel}`;
  pintarCluster();
  pintarFase();
}

function esEscrita(){ return NIVELES[E.nivel].escritas.includes(E.i); }

    ${f.dice ? `<p class="dice">«${esc(f.dice)}»</p>` : ''}
    <p class="escena" style="margin-top:10px"><em>${esc(f.pregunta)}</em></p>
  </div>
  <div id="zona"></div>`;
  if(esEscrita()) pintarEscritura(f); else pintarOpciones(f);
  window.scrollTo({top:0, behavior:'smooth'});
}

function pintarOpciones(f){
  const z = document.getElementById('zona');
  z.innerHTML = '<div class="ops" id="ops"></div><div id="fb"></div>';
  const cont = document.getElementById('ops');
  f.ops.forEach((o,ix) => {
    const b = document.createElement('button');
    b.className = 'op';
    b.innerHTML = `<span class="letra">${'ABC'[ix]}</span><span>${esc(o.t)}</span>`;
    b.addEventListener('click', () => elegir(ix));
    cont.appendChild(b);
  });
  const seg = NIVELES[E.nivel].reloj;
  if(seg){
    E.seg = seg;
    cReloj.classList.remove('hidden');
    cReloj.textContent = seg + 's';
    cReloj.classList.remove('poco');
    E.reloj = setInterval(() => {
      E.seg--;
      cReloj.textContent = E.seg + 's';
      cReloj.classList.toggle('poco', E.seg <= 7);
      if(E.seg <= 0) elegir(-1);
    }, 1000);
  }
}

function elegir(ix){
  pararReloj();
  const f = E.fases[E.i];
  const o = ix >= 0 ? f.ops[ix] : {t:'(se le fue el tiempo)', pts:-10, v:'mal',
    fb:'El cliente quedó viendo cómo usted lo pensaba. Dudar frente al cliente también comunica.', p:'Hallazgo 21'};
  E.pts += o.pts;
  E.conf = Math.max(0, Math.min(100, E.conf + o.pts));
  E.hist.push({fase:f.fase, v:o.v, pts:o.pts, fb:o.fb, p:o.p, dijo:ix >= 0 ? o.t : null});
  pintarCluster();

  document.querySelectorAll('#ops .op').forEach((b,i) => {
    b.disabled = true;
    if(i === ix){ b.classList.add('elegida'); b.classList.add(o.v === 'bien' ? 'buena' : o.v === 'mal' ? 'mala' : 'elegida'); }
  });

  const seFue = E.conf <= 0, ultima = E.i === E.fases.length - 1;
  if(NIVELES[E.nivel].alFinal && !seFue && !ultima){ E.i++; pintarFase(); return; }
  if(NIVELES[E.nivel].alFinal){ resultado(seFue); return; }

  mostrarSello(o, seFue, ultima);
}

function mostrarSello(o, seFue, ultima){
  const vC = o.v === 'bien' ? 'v-bien' : o.v === 'medio' ? 'v-medio' : 'v-mal';
  const vT = o.v === 'bien' ? 'Bien hecho' : o.v === 'medio' ? 'A medias' : 'Ahí la perdió';
  document.getElementById('fb').innerHTML = `
  <div class="sello">
    <div class="sello-top"><span class="veredicto ${vC}">${vT}</span><span class="delta">${o.pts > 0 ? '+' : ''}${o.pts} ${o.partes ? 'puntos' : 'confianza'}</span></div>
    <p>${esc(o.fb)}</p>
    ${o.partes && o.partes.length ? `<div class="lista">${o.partes.map(x => `<div class="li ${x.ok ? 'si' : 'no'}"><span class="m">${x.ok ? '✓' : '✕'}</span><span>${esc(x.et)}</span></div>`).join('')}</div>` : ''}
    ${o.p ? `<div class="principio">${esc(o.p)}</div>` : ''}
  </div>
  <button class="btn full" id="seguir">${seFue ? 'Ver qué pasó' : ultima ? 'Cerrar el turno' : 'Siguiente'}</button>`;
  document.getElementById('seguir').addEventListener('click', () => {
    if(seFue || ultima) resultado(seFue); else { E.i++; pintarFase(); }
  });
  document.getElementById('fb').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function iniciarTraductor(){
  pararTodo();
  T.orden = TRADUCCIONES.map((_,i) => i).sort(() => Math.random()-0.5);
  T.i = 0; T.aciertos = 0; T.pts = 0; T.seg = 60;
  cluster.classList.add('hidden');
  T.reloj = setInterval(() => {
    T.seg--;
    const r = document.getElementById('trReloj');
    if(r){ r.textContent = T.seg + 's'; r.classList.toggle('poco', T.seg <= 15); }
    if(T.seg <= 0){ clearInterval(T.reloj); resultadoTraductor(true); }
  }, 1000);
  pintarTrad();
}
function pintarTrad(){
  if(T.i >= T.orden.length){ clearInterval(T.reloj); resultadoTraductor(false); return; }
  const it = TRADUCCIONES[T.orden[T.i]];
  const ops = barajar(it.ops.slice());
  app.innerHTML = `
  <div style="padding-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px">
    <span class="eyebrow">Traductor · ${T.i+1} de ${T.orden.length}</span>
    <span class="reloj" id="trReloj" style="margin:0">${T.seg}s</span>
  </div>
  <div class="specbox"><div class="k">El spec</div><div class="v">${esc(it.spec)}</div><div class="c"><b>El cliente:</b> ${esc(it.cliente)}</div></div>
  <p style="margin-top:14px;font-size:14.5px;opacity:.8">Escoja la traducción completa: spec → le permite → ideal para usted porque.</p>
  <div class="ops" id="ops"></div><div id="fb"></div>`;
  const cont = document.getElementById('ops');
  ops.forEach((o,ix) => {
    const b = document.createElement('button');
    b.className = 'op';
    b.innerHTML = `<span class="letra">${'ABC'[ix]}</span><span>${esc(o.t)}</span>`;
    b.addEventListener('click', () => responderTrad(o, ops));
    cont.appendChild(b);
  });
}
function responderTrad(el, ops){
  if(el.ok){ T.aciertos++; T.pts += 12 + Math.max(0, Math.floor(T.seg/10)); } else { T.pts -= 5; }
  document.querySelectorAll('#ops .op').forEach((b,i) => {
    b.disabled = true;
    if(ops[i].ok) b.classList.add('elegida','buena');
    if(ops[i] === el && !el.ok) b.classList.add('elegida','mala');
  });
  document.getElementById('fb').innerHTML = `
  <div class="sello">
    <div class="sello-top"><span class="veredicto ${el.ok ? 'v-bien' : 'v-mal'}">${el.ok ? 'Correcta' : 'Incompleta'}</span><span class="delta">${T.pts} pts</span></div>
    <p>${esc(el.fb)}</p>
    <div class="principio">Fórmula 14 · Hallazgo 4</div>
  </div>
  <button class="btn full" id="sig">Siguiente spec</button>`;
  document.getElementById('sig').addEventListener('click', () => { T.i++; pintarTrad(); });
}

async function correrDiagnostico(){
  const r = [];
  r.push({ ok: !!window.supabase, t:'La librer\u00eda de Supabase carg\u00f3',
    ayuda:'No carg\u00f3 el script del CDN. Revise que tenga internet y que la l\u00ednea con supabase-js@2 siga arriba en el archivo.' });
  r.push({ ok: estaConfigurado(), t:'Su URL y su llave anon est\u00e1n puestas',
    ayuda:'P\u00e9guelas aqu\u00ed abajo, en los dos campos.' });
  r.push({ ok: !!supabase, t:'El cliente se cre\u00f3',
    ayuda:'No se pudo crear el cliente. Casi siempre es porque falta uno de los dos datos.' });
  if(supabase){
    try{
      const { error } = await supabase.from(TABLA).select('score').limit(1);
      if(error) throw error;
      r.push({ ok:true, t:`Puede leer la tabla \u00ab${TABLA}\u00bb` });
    }catch(e){
      const m = ((e && e.message) || '') + ' ' + ((e && e.code) || '');
      let ayuda = 'Error: ' + ((e && e.message) || e);
      if(/does not exist|404|not find|schema cache/i.test(m))
        ayuda = `No encuentra la tabla \u00ab${TABLA}\u00bb. Rev\u00edsela en Supabase y escr\u00edbala igual, respetando may\u00fasculas.`;
      else if(/jwt|apikey|api key|401|invalid/i.test(m))
        ayuda = 'La llave anon no sirve. C\u00f3piela otra vez de Project Settings \u2192 API \u2192 anon public.';
      else if(/policy|permission|row-level|403/i.test(m))
        ayuda = 'RLS le bloquea la lectura. Necesita una pol\u00edtica de SELECT con USING (true).';
      else if(/failed to fetch|network/i.test(m))
        ayuda = 'No hay red, o la URL del proyecto est\u00e1 mal escrita.';
      r.push({ ok:false, t:`Puede leer la tabla \u00ab${TABLA}\u00bb`, ayuda });
    }
  }
  return r;
}

    <div id="diag"><p class="vacio">Revisando\u2026</p></div>

    <div class="hoja" style="margin-top:18px">
      <span class="fase">Pegue sus datos aqu\u00ed</span>
      <p style="font-size:14px;line-height:1.5">As\u00ed no tiene que editar el archivo. Se guardan en este navegador y mandan sobre lo que diga el c\u00f3digo.</p>
      <div class="campo" style="margin-top:14px">
        <label for="fUrl">Project URL</label>
        <input id="fUrl" placeholder="https://xxxxx.supabase.co" spellcheck="false" autocapitalize="off" style="font-family:'Space Mono',monospace;font-size:14px;text-transform:none">
      </div>
      <div class="campo" style="margin-top:14px">
        <label for="fKey">anon public key</label>
        <input id="fKey" placeholder="eyJhbGciOi..." spellcheck="false" autocapitalize="off" style="font-family:'Space Mono',monospace;font-size:14px;text-transform:none">
      </div>
      <div class="btnrow">
        <button class="btn" id="guardar">Guardar y probar</button>
        <button class="btn sec" id="olvidar">Olvidar</button>
      </div>
    </div>

    <div id="lineas"></div>
    <div id="prueba"></div>

    <div class="btnrow">
      <button class="btn" id="menu">Volver</button>
      <button class="btn sec" id="otra">Revisar de nuevo</button>
      <button class="btn sec" id="probar">Probar guardado</button>
    </div>
    <footer>\u00abProbar guardado\u00bb inserta una fila llamada PRUEBA con 0 puntos.<br>La puede borrar despu\u00e9s desde el Table Editor de Supabase.</footer>
  </div>`;

  const fU = document.getElementById('fUrl'), fK = document.getElementById('fKey');
  if(estaConfigurado()){ fU.value = CFG.url; fK.value = CFG.key; }

  document.getElementById('menu').addEventListener('click', portada);
  document.getElementById('otra').addEventListener('click', pintarDiagnostico);
  document.getElementById('guardar').addEventListener('click', async () => {
    guardarCfg(fU.value, fK.value);
    fU.value = CFG.url; fK.value = CFG.key;
    await pintarDiagnostico();
  });
  document.getElementById('olvidar').addEventListener('click', async () => {
    olvidarCfg(); fU.value = ''; fK.value = '';
    await pintarDiagnostico();
  });
  document.getElementById('probar').addEventListener('click', async () => {
    const z = document.getElementById('prueba');
    if(!z) return;
    z.innerHTML = '<div class="estado pend"><span class="ic">\u00b7\u00b7</span><span>Insertando fila de prueba\u2026</span></div>';
    const res = await guardarPuntaje('PRUEBA', 0);
    const z2 = document.getElementById('prueba');
    if(!z2) return;
    z2.innerHTML = res.ok
      ? '<div class="estado ok"><span class="ic">\u2713</span><span>Guard\u00f3 bien. Su tabla ya recibe puntajes: revise el Table Editor y ah\u00ed va a estar la fila PRUEBA.</span></div>'
      : `<div class="estado no"><span class="ic">!</span><span>No pudo guardar: ${esc(res.motivo)}. Si menciona policy o row-level, le falta la pol\u00edtica de INSERT con WITH CHECK (true).</span></div>`;
  });

  await pintarDiagnostico();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- RANKING EN VIVO ---------- */
function haceCuanto(iso){
  if(!iso) return '';
  const d = (Date.now() - new Date(iso).getTime()) / 60000;
  if(isNaN(d)) return '';
  if(d < 1) return 'hace un momento';
  if(d < 60) return `hace ${Math.floor(d)} min`;
  if(d < 1440) return `hace ${Math.floor(d/60)} h`;
  return `hace ${Math.floor(d/1440)} d`;
}

async function refrescarRanking(){
  const t = document.getElementById('tabla');
  if(!t) return;
  const r = await obtenerMejoresPuntajes(10);
  const t2 = document.getElementById('tabla');
  if(!t2) return;
  const yo = (jugador || '').trim().toUpperCase();
  t2.innerHTML = !r.filas.length
    ? '<p class="vacio">Todav\u00eda nadie ha jugado. Sea el primero.</p>'
    : `<ul class="rank">${r.filas.map((f,i) => `
        <li class="${(f.player_name || '').toUpperCase() === yo && yo ? 'yo' : ''}">
          <span class="pos">${i+1}</span>
          <span class="nom">${esc(f.player_name || '\u2014')}</span>
          <span class="fch">${esc(haceCuanto(f.created_at))}</span>
          <span class="sc">${f.score}</span>
        </li>`).join('')}</ul>`;
  const av = document.getElementById('aviso');
  if(av){
    if(r.ok){ av.classList.add('hidden'); }
    else {
      av.classList.remove('hidden');
      av.textContent = r.motivo === 'sin-conexion'
        ? 'Sin conexi\u00f3n con la base: est\u00e1 viendo solo los puntajes de este dispositivo. Revise que peg\u00f3 su URL y su llave anon en el archivo.'
        : 'No se pudo leer la base (' + r.motivo + '). Mostrando lo guardado en este dispositivo.';
    }
  }
  const p = document.getElementById('pend');
  if(p){
    const n = leerLocal().length;
    p.textContent = n ? `${n} puntaje${n>1?'s':''} esperando subir desde este dispositivo.` : '';
  }
}
